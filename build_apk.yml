name: Build Sanafir Urban Boundary Checker APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Automated GIS Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Installable Debug APK
        run: gradle assembleDebug

      - name: Build Release App Bundle (AAB)
        run: gradle bundleRelease

      - name: Upload SanafirUrbanBoundaryChecker.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanafirUrbanBoundaryChecker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
